# Replace the hostname and certificate paths before enabling.
server {
    listen 80;
    server_name sales.your-company.local;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name sales.your-company.local;
    ssl_certificate /etc/ssl/othoba/fullchain.pem;
    ssl_certificate_key /etc/ssl/othoba/privkey.pem;
    root /opt/othoba/SalesDashboard;
    index index.html;
    client_max_body_size 300m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location /api/ {
        proxy_pass http://127.0.0.1:3011/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
    location = /app-config.js { add_header Cache-Control no-store; }
    location = /index.html { add_header Cache-Control no-cache; }
    location / { try_files $uri $uri/ =404; }
}
